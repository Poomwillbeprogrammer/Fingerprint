<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Fingerprint System (RMUTL)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-stone-950 text-stone-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-600 to-yellow-500 text-white shadow-lg shadow-amber-500/25 mb-4">
        <i class="fa-solid fa-fingerprint text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-wider">FINGERPRINT ADMIN</h1>
      <p class="text-sm text-stone-400 mt-1">ระบบบริหารจัดการลายนิ้วมือและประวัติเข้า-ออก (มทร.ล้านนา)</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6 flex items-center gap-2">
        <i class="fa-solid fa-lock text-amber-400 text-sm"></i> เข้าสู่ระบบผู้ดูแล
      </h2>

      <div id="errorAlert" class="hidden mb-5 px-3.5 py-2.5 rounded-lg bg-rose-500/10 text-rose-300 text-xs flex items-center gap-2.5">
        <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
        <span id="errorMessage">เกิดข้อผิดพลาด</span>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-medium text-stone-300 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-stone-400">
              <i class="fa-regular fa-user text-sm"></i>
            </span>
            <input type="text" id="username" required
              class="w-full pl-10 pr-4 py-2.5 bg-stone-900/70 border border-stone-700 rounded-xl text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm transition"
              placeholder="admin">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-stone-300 mb-1.5">รหัสผ่าน (Password)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-stone-400">
              <i class="fa-solid fa-key text-sm"></i>
            </span>
            <input type="password" id="password" required
              class="w-full pl-10 pr-4 py-2.5 bg-stone-900/70 border border-stone-700 rounded-xl text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-sm transition"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="loginBtn"
          class="w-full py-3 px-4 bg-gradient-to-r from-amber-700 via-amber-600 to-yellow-500 hover:from-amber-600 hover:to-yellow-400 text-white font-medium rounded-xl shadow-lg shadow-amber-500/25 transition duration-200 flex items-center justify-center gap-2">
          <span>เข้าสู่ระบบ</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>


    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('admin_user', data.username);
          window.location.href = '/index.html';
        } else {
          errorAlert.classList.remove('hidden');
          errorMessage.innerText = data.error || 'เข้าสู่ระบบไม่สำเร็จ';
        }
      } catch (err) {
        errorAlert.classList.remove('hidden');
        errorMessage.innerText = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>เข้าสู่ระบบ</span><i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    });
  </script>
</body>
</html>
